<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar Mi Tarjeta Digital</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: #060D1A; color: #F8FAFC; padding: 24px 5%; }
    .box { max-width: 720px; margin: 0 auto; background: #0F172A; border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 26px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 12.5px; color: #94A3B8; margin-bottom: 5px; font-weight: 600; }
    input[type="text"], input[type="email"], input[type="url"], select {
      width: 100%; padding: 10px 12px; border-radius: 9px; background: #060D1A; border: 1px solid rgba(255,255,255,0.12); color: white; font-size: 13.5px;
    }
    .btn { padding: 11px 18px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn-cyan { background: #0EA5E9; color: #04101E; }
    .btn-ghost { background: rgba(255,255,255,0.08); color: white; }
    @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="box">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px;">
      <h2>Personalizar Mi Tarjeta Digital</h2>
      <div>
        <a href="{% url 'ver_tarjeta_publica' t.slug %}" target="_blank" class="btn btn-cyan">Ver Mi Tarjeta en Vivo ↗</a>
        <a href="{% url 'dashboard' %}" class="btn btn-ghost">← Volver al Portal</a>
      </div>
    </div>

    {% if guardado %}
      <div style="padding:12px; border-radius:10px; background:rgba(16,185,129,0.15); border:1px solid rgba(16,185,129,0.4); color:#6EE7B7; margin-bottom:16px; font-size:13.5px;">
        ¡Tus cambios se han publicado en tu tarjeta digital!
      </div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="grid-2">
        <div class="field">
          <label>Elige el Diseño de tu Tarjeta</label>
          <select name="plantilla">
            {% for val, texto in t.PLANTILLAS %}
              <option value="{{ val }}" {% if t.plantilla == val %}selected{% endif %}>{{ texto }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field">
          <label>Actualizar Foto de Perfil</label>
          <input type="file" name="foto" accept="image/*" style="color:#94A3B8;">
        </div>
      </div>

      <div class="grid-2">
        <div class="field"><label>Tu Nombre Completo</label><input type="text" name="nombre_completo" value="{{ t.nombre_completo }}" required></div>
        <div class="field"><label>Tu Cargo o Especialidad</label><input type="text" name="cargo" value="{{ t.cargo }}" required></div>
      </div>

      <div class="grid-2">
        <div class="field"><label>Nombre de tu Empresa</label><input type="text" name="empresa" value="{{ t.empresa }}"></div>
        <div class="field"><label>Frase o Servicios Clave</label><input type="text" name="lema_especialidades" value="{{ t.lema_especialidades }}"></div>
      </div>

      <div class="grid-2">
        <div class="field"><label>Teléfono de Llamadas</label><input type="text" name="telefono" value="{{ t.telefono }}" required></div>
        <div class="field"><label>Número de WhatsApp (ej. 584141234567)</label><input type="text" name="whatsapp" value="{{ t.whatsapp }}" required></div>
      </div>

      <div class="grid-2">
        <div class="field"><label>Correo Electrónico</label><input type="email" name="correo" value="{{ t.correo }}" required></div>
        <div class="field"><label>Página Web</label><input type="url" name="sitio_web" value="{{ t.sitio_web }}"></div>
      </div>

      <div class="field"><label>Enlace para Agendar Citas (Opcional)</label><input type="url" name="link_agenda" value="{{ t.link_agenda }}"></div>

      <div class="grid-2">
        <div class="field"><label>LinkedIn</label><input type="url" name="linkedin" value="{{ t.linkedin }}"></div>
        <div class="field"><label>Instagram</label><input type="url" name="instagram" value="{{ t.instagram }}"></div>
        <div class="field"><label>YouTube</label><input type="url" name="youtube" value="{{ t.youtube }}"></div>
        <div class="field"><label>Facebook</label><input type="url" name="facebook" value="{{ t.facebook }}"></div>
      </div>

      <button type="submit" class="btn btn-cyan" style="width:100%; margin-top:10px;">Guardar y Actualizar Mi Tarjeta</button>
    </form>
  </div>
</body>
</html>
