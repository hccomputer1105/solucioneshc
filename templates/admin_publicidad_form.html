<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestionar Publicidad · {{ cliente.username }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: #060D1A; color: #F8FAFC; padding: 28px 5%; }
    .box { max-width: 760px; margin: 0 auto; background: #0F172A; border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 28px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 12.5px; color: #94A3B8; margin-bottom: 5px; font-weight: 600; }
    input[type="text"], input[type="url"], input[type="date"], select, textarea {
      width: 100%; padding: 10px 12px; border-radius: 9px; background: #060D1A; border: 1px solid rgba(255,255,255,0.12); color: white; font-size: 13.5px;
    }
    .perm-box {
      padding: 14px; border-radius: 12px; background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.35);
      margin-bottom: 14px; display: flex; align-items: center; gap: 10px; font-weight: 600;
    }
    .status-bar {
      padding: 12px 14px; border-radius: 10px; background: rgba(14,165,233,0.1); border: 1px solid rgba(14,165,233,0.3);
      margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 13.5px;
    }
    .html-box {
      padding: 16px; border-radius: 12px; background: rgba(14,165,233,0.08); border: 1px solid rgba(14,165,233,0.3); margin-top: 16px;
    }
    .btn { padding: 11px 18px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn-cyan { background: #0EA5E9; color: #04101E; }
    .btn-ghost { background: rgba(255,255,255,0.08); color: white; }
    @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="box">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h2>Publicidad Web · Cliente: <span style="color:#0EA5E9;">{{ cliente.username }}</span></h2>
      <a href="{% url 'dashboard' %}" class="btn btn-ghost">← Volver</a>
    </div>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <label class="perm-box">
        <input type="checkbox" name="habilitada" {% if b.habilitada %}checked{% endif %} style="width:18px; height:18px;">
        <span>Habilitar espacio publicitario en la web para este cliente</span>
      </label>

      <div class="status-bar">
        <span>Código de Anuncio: <strong style="color:#38BDF8;">{{ b.codigo_anuncio }}</strong></span>
        <span>Vigencia actual: <strong>{{ b.dias_restantes }} días restantes</strong></span>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Ubicación en la Web</label>
          <select name="ubicacion">
            <option value="estandar" {% if b.ubicacion == 'estandar' %}selected{% endif %}>Tarjeta Aliado (Cuadrícula B2B)</option>
            <option value="destacado" {% if b.ubicacion == 'destacado' %}selected{% endif %}>Banner Destacado (Ancho Completo)</option>
          </select>
        </div>
        <div class="field">
          <label>Fecha de Vencimiento</label>
          <input type="date" name="fecha_vencimiento" value="{{ b.fecha_vencimiento|date:'Y-m-d' }}">
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Plan Contratado</label>
          <select name="plan">
            <option value="mensual" {% if b.plan == 'mensual' %}selected{% endif %}>Plan Mensual (30 días)</option>
            <option value="trimestral" {% if b.plan == 'trimestral' %}selected{% endif %}>Plan Trimestral (90 días)</option>
            <option value="anual" {% if b.plan == 'anual' %}selected{% endif %}>Plan Anual (365 días)</option>
          </select>
        </div>
        <div class="field">
          <label>Imagen / Banner (Recomendado 800x400 px)</label>
          <input type="file" name="imagen" accept="image/*" style="color:#94A3B8;">
        </div>
      </div>

      <div class="field"><label>Título del Anuncio / Empresa *</label><input type="text" name="titulo" value="{{ b.titulo }}" required></div>
      <div class="field"><label>Texto Promocional *</label><textarea name="texto" rows="2" required>{{ b.texto }}</textarea></div>

      <div class="grid-2">
        <div class="field"><label>Texto del Botón</label><input type="text" name="texto_boton" value="{{ b.texto_boton }}"></div>
        <div class="field"><label>Enlace de Destino (Web o WhatsApp)</label><input type="url" name="enlace_destino" value="{{ b.enlace_destino }}"></div>
      </div>

      <div class="html-box">
        <label style="display:flex; align-items:center; gap:8px; color:#38BDF8; cursor:pointer; margin-bottom:10px;">
          <input type="checkbox" name="usar_html_personalizado" {% if b.usar_html_personalizado %}checked{% endif %}>
          <span>Modo VIP: Usar código HTML personalizado (bloquea edición al cliente)</span>
        </label>
        <textarea name="codigo_html_personalizado" rows="5" placeholder="Pega aquí código HTML personalizado si deseas un banner a medida...">{{ b.codigo_html_personalizado }}</textarea>
      </div>

      <button type="submit" class="btn btn-cyan" style="margin-top:18px; width:100%;">Guardar Configuración de Publicidad</button>
    </form>
  </div>
</body>
</html>
