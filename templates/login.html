<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso al Portal | Soluciones Tecnológicas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #060D1A;
      --bg-surface: #0F172A;
      --accent-cyan: #0EA5E9;
      --accent-emerald: #10B981;
      --text-light: #F8FAFC;
      --text-gray: #94A3B8;
      --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top right, rgba(14, 165, 233, 0.16), transparent 45%),
                  linear-gradient(160deg, var(--bg-dark) 0%, var(--bg-surface) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text-light);
    }

    .login-card {
      width: 100%;
      max-width: 410px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 36px 30px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    .brand {
      text-align: center;
      margin-bottom: 26px;
    }

    .shield-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: rgba(14, 165, 233, 0.12);
      color: var(--accent-cyan);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      border: 1px solid rgba(14, 165, 233, 0.25);
    }

    .brand h1 { font-size: 20px; font-weight: 800; letter-spacing: 0.3px; }
    .brand h1 span { color: var(--accent-cyan); }
    .brand p { font-size: 13px; color: var(--text-gray); margin-top: 6px; }

    .alert-error {
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #FCA5A5;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 18px;
      text-align: center;
    }

    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-gray);
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(6, 13, 26, 0.75);
      border: 1px solid var(--border);
      color: white;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }

    .field input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: var(--accent-cyan);
      color: #04101E;
      border: none;
      border-radius: 10px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 6px;
    }

    .btn-submit:hover { background: #38BDF8; }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-gray);
      text-decoration: none;
    }

    .back-link:hover { color: white; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand">
      <div class="shield-icon">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <h1>SOLUCIONES <span>TECNOLÓGICAS</span></h1>
      <p>Gestión de Proyectos &amp; Panel Administrativo</p>
    </div>

    {% if error %}
      <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required autofocus>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">Iniciar Sesión →</button>
    </form>

    <a href="https://solucioneshc.com/" class="back-link">← Volver al sitio web principal</a>
  </div>

</body>
</html>
