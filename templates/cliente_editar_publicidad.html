<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar Mi Publicidad</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: #060D1A; color: #F8FAFC; padding: 24px 5%; }
    .box { max-width: 680px; margin: 0 auto; background: #0F172A; border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 26px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 12.5px; color: #94A3B8; margin-bottom: 5px; font-weight: 600; }
    input[type="text"], input[type="url"], textarea {
      width: 100%; padding: 10px 12px; border-radius: 9px; background: #060D1A; border: 1px solid rgba(255,255,255,0.12); color: white; font-size: 13.5px;
    }
    .btn { padding: 11px 18px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn-cyan { background: #0EA5E9; color: #04101E; }
    .btn-ghost { background: rgba(255,255,255,0.08); color: white; }
  </style>
</head>
<body>
  <div class="box">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
      <h2>Personalizar Mi Banner Publicitario</h2>
      <a href="{% url 'dashboard' %}" class="btn btn-ghost">← Volver al Portal</a>
    </div>

    {% if guardado %}
      <div style="padding:12px; border-radius:10px; background:rgba(16,185,129,0.15); border:1px solid rgba(16,185,129,0.4); color:#6EE7B7; margin-bottom:16px; font-size:13.5px;">
        ¡Tu anuncio se ha actualizado en la página principal!
      </div>
    {% endif %}

    {% if b.imagen %}
      <div style="margin-bottom:16px;">
        <span style="font-size:12px; color:#94A3B8; display:block; margin-bottom:6px;">Imagen actual:</span>
        <img src="{{ b.imagen.url }}" alt="{{ b.titulo }}" style="max-height:150px; border-radius:10px; border:1px solid rgba(255,255,255,0.12);">
      </div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="field">
        <label>Subir Nueva Imagen / Banner (JPG, PNG, WEBP)</label>
        <input type="file" name="imagen" accept="image/*" style="color:#94A3B8;">
      </div>
      <div class="field">
        <label>Título de tu Empresa o Promoción</label>
        <input type="text" name="titulo" value="{{ b.titulo }}" maxlength="120" required>
      </div>
      <div class="field">
        <label>Texto del Anuncio (Máx. 260 caracteres)</label>
        <textarea name="texto" rows="3" maxlength="260" required>{{ b.texto }}</textarea>
      </div>
      <div class="field">
        <label>Texto del Botón de Acción</label>
        <input type="text" name="texto_boton" value="{{ b.texto_boton }}" maxlength="40" required>
      </div>
      <div class="field">
        <label>Enlace de Destino (Tu Sitio Web, Instagram o WhatsApp)</label>
        <input type="url" name="enlace_destino" value="{{ b.enlace_destino }}" required>
      </div>
      <button type="submit" class="btn btn-cyan" style="width:100%;">Publicar Cambios en Mi Anuncio</button>
    </form>
  </div>
</body>
</html>
